# Routine version updates. Security updates for vulnerable dependencies are raised independently
# of this file (repo setting), and those have been arriving already.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the week's non-major bumps instead of one per package; majors stay separate
      # since they're the ones that need reading.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The Dockerfiles' node:26-alpine base is deliberately a floating tag (see Dockerfile), so the
  # docker ecosystem is left out on purpose rather than forgotten.
