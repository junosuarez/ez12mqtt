name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to different code at any
# time, and `publish` runs with packages: write. Dependabot (.github/dependabot.yml) bumps the SHA
# and the version comment together.

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so the token needn't be left in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to match Dockerfile's node:26-alpine. Not node-version-file, which would
          # read engines '>=26.0.0' as a range and follow it onto 27 when that ships.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    # The container-backed suite (tests/e2e.ts): real mosquitto, the mock inverter and the built
    # image. Unit tests can't see wiring regressions — #7 broke startup discovery and max-power
    # control while `npm test` stayed green, and nothing ran this suite to notice.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so the token needn't be left in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Not `npm run test:e2e`: that script is wired for local podman (socket override, Ryuk off,
      # podman's auth file). The runner's stock Docker is what testcontainers expects by default.
      - run: node tests/e2e.ts

  build:
    # Proves the Dockerfile builds, for both architectures, in parallel with the tests rather than
    # after them. Pushes nothing; it fills the layer cache that `publish` then reuses.
    name: build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so the token needn't be left in .git/config for later steps.
          persist-credentials: false

      # Runners are x86_64, but the image has to run on arm64 (a k3s cluster on Apple
      # silicon). Publishing amd64-only would fail at exec time, not build time.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # The base is a floating tag so rebuilds pick up its security patches — but the
          # layer cache would happily reuse a stale base and quietly defeat that.
          pull: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Separate from `build` so the build can run alongside the tests while pushing still waits for
    # them: nothing reaches the registry unless test, e2e and the build all passed. Every layer is
    # already in the cache `build` just wrote, so this is mostly the push.
    name: publish image
    if: github.event_name != 'pull_request'
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ready:
    # The one check to require in branch protection: green only when everything a merge depends on
    # succeeded. Requiring this instead of each job means the rule never needs updating when a job
    # is added or renamed. Not `publish`: that's a post-merge step, skipped on every PR. `always()` so it still runs, and fails, when something it needs failed or was
    # cancelled; a needed job that never ran would otherwise leave this skipped, which GitHub
    # treats as passing.
    if: always()
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not ready: a required job finished with '$result'."
              exit 1
            fi
          done
