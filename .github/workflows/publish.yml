name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned to match Dockerfile's node:26-alpine. Not node-version-file, which would
          # read engines '>=26.0.0' as a range and follow it onto 27 when that ships.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    # The container-backed suite (tests/e2e.ts): real mosquitto, the mock inverter and the built
    # image. Unit tests can't see wiring regressions — #7 broke startup discovery and max-power
    # control while `npm test` stayed green, and nothing ran this suite to notice.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Not `npm run test:e2e`: that script is wired for local podman (socket override, Ryuk off,
      # podman's auth file). The runner's stock Docker is what testcontainers expects by default.
      - run: node tests/e2e.ts

  publish:
    # On a PR this job builds but pushes nothing. Naming it "publish" regardless made a green
    # check on an open PR look like it had already published.
    name: ${{ github.event_name == 'pull_request' && 'build image (no push)' || 'publish image' }}
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Runners are x86_64, but the image has to run on arm64 (a k3s cluster on Apple
      # silicon). Publishing amd64-only would fail at exec time, not build time.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # The base is a floating tag so rebuilds pick up its security patches — but the
          # layer cache would happily reuse a stale base and quietly defeat that.
          pull: true
          # PRs build to prove the Dockerfile still works, but publish nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
